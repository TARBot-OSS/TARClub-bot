name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest -v

  updater-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check vendored updater matches the pinned tarbot-console
        run: |
          REF="$(grep -o 'tarbot-console.git@[^ ]*' requirements.txt | cut -d@ -f2)"
          curl -fsSL "https://raw.githubusercontent.com/TARBot-OSS/tarbot-console/${REF}/updater/bot_update_lib.sh" -o canonical_bot_update_lib.sh
          diff -u canonical_bot_update_lib.sh scripts/bot_update_lib.sh
